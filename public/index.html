<!doctype html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <title>Hair Product Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">

    <style>
        table {
            table-layout: fixed;
            width: 100%;
        }

        th,
        td {
            word-wrap: break-word;
            white-space: normal;
            vertical-align: top;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <h1 class="mb-3">Hair Product Finder</h1>

        <div class="mb-3">
            <a href="/insert.html" class="btn btn-success">Add New Product</a>
        </div>

        <p class="mb-4">Search, filter, sort, and limit hair products from the database.</p>

        <form id="searchForm" class="border rounded p-3 bg-light">
            <div class="row mb-3">
                <div class="col-md-2">
                    <label for="hair" class="form-label">Hair Type</label>
                </div>
                <div class="col-md-10">
                    <select id="hair" class="form-select">
                        <option value="">Any</option>
                        <option value="Straight">Straight</option>
                        <option value="Wavy">Wavy</option>
                        <option value="Curly">Curly</option>
                        <option value="Kinky">Kinky</option>
                        <option value="All">All</option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-2">
                    <label for="brand" class="form-label">Brand Name</label>
                </div>
                <div class="col-md-10">
                    <input id="brand" type="text" class="form-control" placeholder="Enter brand name">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-2">
                    <label for="product" class="form-label">Product Type</label>
                </div>
                <div class="col-md-10">
                    <select id="product" class="form-select">
                        <option value="">Any</option>
                        <option value="Shampoo">Shampoo</option>
                        <option value="Cream">Cream</option>
                        <option value="Gel">Gel</option>
                        <option value="Oil">Oil</option>
                        <option value="Spray">Spray</option>
                        <option value="Mask">Mask</option>
                        <option value="Protectant">Protectant</option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-2">
                    <label for="concerns" class="form-label">Concerns</label>
                </div>
                <div class="col-md-10">
                    <select id="concerns" class="form-select">
                        <option value="">Any</option>
                        <option value="Dryness">Dryness</option>
                        <option value="Frizz">Frizz</option>
                        <option value="Dirty">Dirty</option>
                        <option value="Heat">Heat</option>
                        <option value="Humidity">Humidity</option>
                        <option value="Breakage">Breakage</option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-2">
                    <label for="sort" class="form-label">Sort By</label>
                </div>
                <div class="col-md-10">
                    <select id="sort" class="form-select">
                        <option value="">None</option>
                        <option value="brand_asc">Brand Name A-Z</option>
                        <option value="brand_desc">Brand Name Z-A</option>
                        <option value="price_asc">Price Low to High</option>
                        <option value="price_desc">Price High to Low</option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-2">
                    <label for="limit" class="form-label">Limit Results</label>
                </div>
                <div class="col-md-10">
                    <select id="limit" class="form-select">
                        <option value="">Show All</option>
                        <option value="10">10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-md-12 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Search for Products</button>
                    <button type="button" id="resetBtn" class="btn btn-secondary">Reset</button>
                </div>
            </div>
        </form>

        <hr>

        <div id="results">
            Results will appear here.
        </div>
    </div>

    <script>
        const form = document.getElementById('searchForm');
        const resultsDiv = document.getElementById('results');
        const resetBtn = document.getElementById('resetBtn');

        function buildTable(data) {
            let displayTable = `
                <table class="table table-striped table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th>Brand Name</th>
                            <th>Product Type</th>
                            <th>Hair Type</th>
                            <th>Type Chart</th>
                            <th>Concerns</th>
                            <th>Price</th>
                            <th>Edit</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            if (data.length === 0) {
                displayTable += `
                    <tr>
                        <td colspan="7" class="text-center">No matching products found.</td>
                    </tr>
                `;
            } else {
                for (const row of data) {
                    displayTable += `
                        <tr>
                            <td>${row.brand_name}</td>
                            <td>${row.product_type}</td>
                            <td>${row.hair_type}</td>
                            <td>${row.type_chart}</td>
                            <td>${row.concerns}</td>
                            <td>$${Number(row.price).toFixed(2)}</td>
                            <td>
                                <a href="/edit.html?id=${row.id}" class="btn btn-sm btn-warning">Edit</a>
                            </td>
                        </tr>
                    `;
                }
            }

            displayTable += `
                    </tbody>
                </table>
            `;

            resultsDiv.innerHTML = displayTable;
        }

        async function loadProducts() {
            const getParameters = {};

            const hair = document.getElementById('hair').value;
            const brand = document.getElementById('brand').value.trim();
            const product = document.getElementById('product').value;
            const concerns = document.getElementById('concerns').value;
            const sort = document.getElementById('sort').value;
            const limit = document.getElementById('limit').value;

            if (hair.length > 0) getParameters.hair = hair;
            if (brand.length > 0) getParameters.brand = brand;
            if (product.length > 0) getParameters.product = product;
            if (concerns.length > 0) getParameters.concerns = concerns;
            if (sort.length > 0) getParameters.sort = sort;
            if (limit.length > 0) getParameters.limit = limit;

            const queryString = new URLSearchParams(getParameters).toString();

            try {
                const response = await fetch('/hair/' + (queryString ? '?' + queryString : ''), {
                    method: 'GET'
                });

                const json = await response.json();

                if (response.status === 200) {
                    buildTable(json.data);
                } else {
                    resultsDiv.innerHTML = `<div class="alert alert-danger">${json.message}</div>`;
                }
            } catch (error) {
                console.error('Error:', error);
                resultsDiv.innerHTML = `<div class="alert alert-danger">An error occurred while loading data.</div>`;
            }
        }

        form.addEventListener('submit', (event) => {
            event.preventDefault();
            loadProducts();
        });

        resetBtn.addEventListener('click', () => {
            form.reset();
            loadProducts();
        });

        loadProducts();
    </script>
</body>

</html>
