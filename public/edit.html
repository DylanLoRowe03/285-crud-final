<!doctype html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <title>Edit Hair Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
</head>

<body>
    <div class="container py-4">
        <h1 class="mb-3">Edit Hair Product</h1>

        <div class="mb-3">
            <a href="/index.html" class="btn btn-primary">Back to Search</a>
            <a href="/insert.html" class="btn btn-success">Add New Product</a>
        </div>

        <p class="mb-4">Edit an existing hair product from the database.</p>

        <div id="message"></div>

        <form id="editForm" class="border rounded p-3 bg-light">
            <div class="row mb-3">
                <div class="col-md-2">
                    <label for="brand_name" class="form-label">Brand Name</label>
                </div>
                <div class="col-md-10">
                    <input id="brand_name" name="brand_name" type="text" class="form-control">
                    <div id="brand_name_error" class="text-danger small mt-1"></div>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-2">
                    <label for="product_type" class="form-label">Product Type</label>
                </div>
                <div class="col-md-10">
                    <input id="product_type" name="product_type" type="text" class="form-control">
                    <div id="product_type_error" class="text-danger small mt-1"></div>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-2">
                    <label for="hair_type_id" class="form-label">Hair Type</label>
                </div>
                <div class="col-md-10">
                    <select id="hair_type_id" name="hair_type_id" class="form-select">
                        <option value="">Choose one</option>
                        <option value="1">Straight</option>
                        <option value="2">Wavy</option>
                        <option value="3">Curly</option>
                        <option value="4">Kinky</option>
                        <option value="5">All</option>
                    </select>
                    <div id="hair_type_id_error" class="text-danger small mt-1"></div>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-2">
                    <label for="concerns" class="form-label">Concerns</label>
                </div>
                <div class="col-md-10">
                    <input id="concerns" name="concerns" type="text" class="form-control">
                    <div id="concerns_error" class="text-danger small mt-1"></div>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-2">
                    <label for="price" class="form-label">Price</label>
                </div>
                <div class="col-md-10">
                    <input id="price" name="price" type="number" step="0.01" class="form-control">
                    <div id="price_error" class="text-danger small mt-1"></div>
                </div>
            </div>

            <button type="submit" class="btn btn-warning">Update Product</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('editForm');
        const messageDiv = document.getElementById('message');

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        function clearErrors() {
            document.getElementById('brand_name_error').textContent = '';
            document.getElementById('product_type_error').textContent = '';
            document.getElementById('hair_type_id_error').textContent = '';
            document.getElementById('concerns_error').textContent = '';
            document.getElementById('price_error').textContent = '';
            messageDiv.innerHTML = '';
        }

        function displayErrors(errors) {
            messageDiv.innerHTML = `<div class="alert alert-danger">Please fix the validation errors below.</div>`;

            if (errors.brand_name) {
                document.getElementById('brand_name_error').textContent = errors.brand_name;
            }

            if (errors.product_type) {
                document.getElementById('product_type_error').textContent = errors.product_type;
            }

            if (errors.hair_type_id) {
                document.getElementById('hair_type_id_error').textContent = errors.hair_type_id;
            }

            if (errors.concerns) {
                document.getElementById('concerns_error').textContent = errors.concerns;
            }

            if (errors.price) {
                document.getElementById('price_error').textContent = errors.price;
            }
        }

        async function loadProduct() {
            if (!productId) {
                messageDiv.innerHTML = `<div class="alert alert-danger">Missing product ID.</div>`;
                form.style.display = 'none';
                return;
            }

            try {
                const response = await fetch('/hair/' + productId, {
                    method: 'GET'
                });

                const json = await response.json();

                if (response.status === 200) {
                    document.getElementById('brand_name').value = json.data.brand_name;
                    document.getElementById('product_type').value = json.data.product_type;
                    document.getElementById('hair_type_id').value = json.data.hair_type_id;
                    document.getElementById('concerns').value = json.data.concerns;
                    document.getElementById('price').value = json.data.price;
                } else {
                    messageDiv.innerHTML = `<div class="alert alert-danger">${json.message}</div>`;
                    form.style.display = 'none';
                }
            } catch (error) {
                console.error(error);
                messageDiv.innerHTML = `<div class="alert alert-danger">${error.message}</div>`;
                form.style.display = 'none';
            }
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            clearErrors();

            const formData = new FormData(form);

            try {
                const response = await fetch('/hair/' + productId, {
                    method: 'PUT',
                    body: formData
                });

                const json = await response.json();

                if (response.status === 200) {
                    messageDiv.innerHTML = `<div class="alert alert-success">${json.message}</div>`;
                } else if (response.status === 400) {
                    displayErrors(json.errors || {});
                } else {
                    messageDiv.innerHTML = `<div class="alert alert-danger">${json.message}</div>`;
                }
            } catch (error) {
                console.error(error);
                messageDiv.innerHTML = `<div class="alert alert-danger">${error.message}</div>`;
            }
        });

        loadProduct();
    </script>
</body>

</html>
